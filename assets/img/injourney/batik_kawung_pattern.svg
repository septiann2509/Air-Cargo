<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="petalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0CA1AF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#087F8A" stop-opacity="0.05"/>
    </radialGradient>
  </defs>
  <!-- Background is transparent so it layers over gradient -->
  
  <!-- Corner Petals -->
  <g fill="none" stroke="#0CA1AF" stroke-width="1.2" opacity="0.35">
    <!-- Center Kawung (40, 40) -->
    <!-- Vertical Petal Center -->
    <path d="M 40 16 C 30 26 30 54 40 64 C 50 54 50 26 40 16 Z" fill="url(#petalGlow)" />
    <!-- Horizontal Petal Center -->
    <path d="M 16 40 C 26 30 54 30 64 40 C 54 50 26 50 16 40 Z" fill="url(#petalGlow)" />
    <!-- Inner Cross / Diamonds -->
    <circle cx="40" cy="40" r="3" fill="#4EBDC3" opacity="0.6"/>
    <circle cx="40" cy="28" r="1.5" fill="#4EBDC3" opacity="0.5"/>
    <circle cx="40" cy="52" r="1.5" fill="#4EBDC3" opacity="0.5"/>
    <circle cx="28" cy="40" r="1.5" fill="#4EBDC3" opacity="0.5"/>
    <circle cx="52" cy="40" r="1.5" fill="#4EBDC3" opacity="0.5"/>

    <!-- Corner Kawung (0, 0) -->
    <path d="M 0 -24 C -10 -14 -10 14 0 24 C 10 14 10 -14 0 -24 Z" fill="url(#petalGlow)" />
    <path d="M -24 0 C -14 -10 14 -10 24 0 C 14 10 -14 10 -24 0 Z" fill="url(#petalGlow)" />
    <circle cx="0" cy="0" r="3" fill="#4EBDC3" opacity="0.6"/>
    <circle cx="0" cy="12" r="1.5" fill="#4EBDC3" opacity="0.5"/>
    <circle cx="12" cy="0" r="1.5" fill="#4EBDC3" opacity="0.5"/>

    <!-- Corner Kawung (80, 0) -->
    <path d="M 80 -24 C 70 -14 70 14 80 24 C 90 14 90 -14 80 -24 Z" fill="url(#petalGlow)" />
    <path d="M 56 0 C 66 -10 94 -10 104 0 C 94 10 66 10 56 0 Z" fill="url(#petalGlow)" />
    <circle cx="80" cy="0" r="3" fill="#4EBDC3" opacity="0.6"/>
    <circle cx="80" cy="12" r="1.5" fill="#4EBDC3" opacity="0.5"/>
    <circle cx="68" cy="0" r="1.5" fill="#4EBDC3" opacity="0.5"/>

    <!-- Corner Kawung (0, 80) -->
    <path d="M 0 56 C -10 66 -10 94 0 104 C 10 94 10 66 0 56 Z" fill="url(#petalGlow)" />
    <path d="M -24 80 C -14 70 14 70 24 80 C 14 90 -14 90 -24 80 Z" fill="url(#petalGlow)" />
    <circle cx="0" cy="80" r="3" fill="#4EBDC3" opacity="0.6"/>
    <circle cx="0" cy="68" r="1.5" fill="#4EBDC3" opacity="0.5"/>
    <circle cx="12" cy="80" r="1.5" fill="#4EBDC3" opacity="0.5"/>

    <!-- Corner Kawung (80, 80) -->
    <path d="M 80 56 C 70 66 70 94 80 104 C 90 94 90 66 80 56 Z" fill="url(#petalGlow)" />
    <path d="M 56 80 C 66 70 94 70 104 80 C 94 90 66 90 56 80 Z" fill="url(#petalGlow)" />
    <circle cx="80" cy="80" r="3" fill="#4EBDC3" opacity="0.6"/>
    <circle cx="80" cy="68" r="1.5" fill="#4EBDC3" opacity="0.5"/>
    <circle cx="68" cy="80" r="1.5" fill="#4EBDC3" opacity="0.5"/>

    <!-- Small intersection diamonds in gaps -->
    <polygon points="40,2 42,4 40,6 38,4" fill="#0CA1AF" opacity="0.4"/>
    <polygon points="40,74 42,76 40,78 38,76" fill="#0CA1AF" opacity="0.4"/>
    <polygon points="2,40 4,42 6,40 4,38" fill="#0CA1AF" opacity="0.4"/>
    <polygon points="74,40 76,42 78,40 76,38" fill="#0CA1AF" opacity="0.4"/>
  </g>
</svg>