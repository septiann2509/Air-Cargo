<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 60 60">
  <defs>
    <style>
      .petal { fill: #087F8A; fill-opacity: 0.15; stroke: #0CA1AF; stroke-width: 1.2; stroke-opacity: 0.45; stroke-linecap: round; stroke-linejoin: round; }
      .inner-seed { fill: #4EBDC3; fill-opacity: 0.675; }
      .dot { fill: #4EBDC3; fill-opacity: 0.81; }
    </style>
  </defs>

  <!-- Center Kawung Flower at (30,30) -->
  <g transform="translate(30, 30)">
    <!-- Top Petal -->
    <path class="petal" d="M 0 -22 C -8 -12 -8 0 0 0 C 8 0 8 -12 0 -22 Z" />
    <circle class="inner-seed" cx="0" cy="-11" r="1.5" />
    <!-- Bottom Petal -->
    <path class="petal" d="M 0 22 C -8 12 -8 0 0 0 C 8 0 8 12 0 22 Z" />
    <circle class="inner-seed" cx="0" cy="11" r="1.5" />
    <!-- Left Petal -->
    <path class="petal" d="M -22 0 C -12 -8 0 -8 0 0 C 0 8 -12 8 -22 0 Z" />
    <circle class="inner-seed" cx="-11" cy="0" r="1.5" />
    <!-- Right Petal -->
    <path class="petal" d="M 22 0 C 12 -8 0 -8 0 0 C 0 8 12 8 22 0 Z" />
    <circle class="inner-seed" cx="11" cy="0" r="1.5" />
    <!-- Center Core Cross -->
    <circle class="dot" cx="0" cy="0" r="2.2" />
  </g>

  <!-- Corner 1: (0, 0) -->
  <g transform="translate(0, 0)">
    <path class="petal" d="M 0 22 C -8 12 -8 0 0 0 C 8 0 8 12 0 22 Z" />
    <circle class="inner-seed" cx="0" cy="11" r="1.5" />
    <path class="petal" d="M 22 0 C 12 -8 0 -8 0 0 C 0 8 12 8 22 0 Z" />
    <circle class="inner-seed" cx="11" cy="0" r="1.5" />
    <circle class="dot" cx="0" cy="0" r="2.2" />
  </g>

  <!-- Corner 2: (60, 0) -->
  <g transform="translate(60, 0)">
    <path class="petal" d="M 0 22 C -8 12 -8 0 0 0 C 8 0 8 12 0 22 Z" />
    <circle class="inner-seed" cx="0" cy="11" r="1.5" />
    <path class="petal" d="M -22 0 C -12 -8 0 -8 0 0 C 0 8 -12 8 -22 0 Z" />
    <circle class="inner-seed" cx="-11" cy="0" r="1.5" />
    <circle class="dot" cx="0" cy="0" r="2.2" />
  </g>

  <!-- Corner 3: (0, 60) -->
  <g transform="translate(0, 60)">
    <path class="petal" d="M 0 -22 C -8 -12 -8 0 0 0 C 8 0 8 -12 0 -22 Z" />
    <circle class="inner-seed" cx="0" cy="-11" r="1.5" />
    <path class="petal" d="M 22 0 C 12 -8 0 -8 0 0 C 0 8 12 8 22 0 Z" />
    <circle class="inner-seed" cx="11" cy="0" r="1.5" />
    <circle class="dot" cx="0" cy="0" r="2.2" />
  </g>

  <!-- Corner 4: (60, 60) -->
  <g transform="translate(60, 60)">
    <path class="petal" d="M 0 -22 C -8 -12 -8 0 0 0 C 8 0 8 -12 0 -22 Z" />
    <circle class="inner-seed" cx="0" cy="-11" r="1.5" />
    <path class="petal" d="M -22 0 C -12 -8 0 -8 0 0 C 0 8 -12 8 -22 0 Z" />
    <circle class="inner-seed" cx="-11" cy="0" r="1.5" />
    <circle class="dot" cx="0" cy="0" r="2.2" />
  </g>

  <!-- Diagonal Diamonds in Empty Quadrants: (15,15), (45,15), (15,45), (45,45) -->
  <polygon points="15,13 17,15 15,17 13,15" fill="#4EBDC3" fill-opacity="0.675" />
  <polygon points="45,13 47,15 45,17 43,15" fill="#4EBDC3" fill-opacity="0.675" />
  <polygon points="15,43 17,45 15,47 13,45" fill="#4EBDC3" fill-opacity="0.675" />
  <polygon points="45,43 47,45 45,47 43,45" fill="#4EBDC3" fill-opacity="0.675" />
</svg>